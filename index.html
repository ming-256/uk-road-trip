<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Road Trip Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f7f1e7;
  --paper-2:#efe4d4;
  --surface:#fffdf9;
  --surface-2:#faf6f0;
  --ink:#2c2218;
  --ink-soft:#6b5c4c;
  --ink-mute:#9c8b78;
  --line:rgba(44,34,24,.09);
  --line-strong:rgba(44,34,24,.14);
  --accent:#c47a3e;
  --accent-deep:#9a5524;
  --accent-soft:#f3e2cf;
  --green:#3f5c4c;
  --green-soft:#e4eee7;
  --blue:#4a6f8a;
  --blue-soft:#e3edf3;
  --shadow-1:0 1px 2px rgba(70,45,20,.05), 0 4px 14px rgba(70,45,20,.07);
  --shadow-2:0 2px 4px rgba(70,45,20,.05), 0 12px 32px rgba(70,45,20,.10);
  --shadow-3:0 4px 8px rgba(70,45,20,.06), 0 20px 48px rgba(70,45,20,.12);
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --radius-pill:999px;
  --waterfall:#4a7ab5;
  --hike:#4f8f62;
  --viewpoint:#c4892e;
  --village:#7b63b0;
  --pub:#c45448;
  --hotel:#3d8fa3;
  --abbey:#8b5cc4;
  --drive:#d17a2e;
  --activity:#2f9e8f;
  --d1:#c47a3e;
  --d2:#3f5c4c;
  --d3:#4a6f8a;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-press:cubic-bezier(.2,.8,.2,1);
  --dur-press:120ms;
  --dur-quick:180ms;
  --dur-base:240ms;
}
body{
  font-family:'DM Sans',-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.55;
  font-size:14px;
  overflow:hidden;
  height:100vh;
  height:100dvh;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────── */
#sidebar{
  width:440px;min-width:440px;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  z-index:100;
  box-shadow:4px 0 24px rgba(70,45,20,.04);
  min-height:0;
  overflow:hidden;
}
#sidebar-header{
  padding:16px 16px 14px;
  background:#2c2218;
  color:#fff;
}
#sidebar-header .brand-row{display:flex;align-items:center;gap:12px}
#sidebar-header .brand{flex:1;min-width:0}
#sidebar-header h1{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.15rem;
  font-weight:600;
  letter-spacing:-.02em;
  margin-bottom:2px;
  line-height:1.2;
}
#sidebar-header p{
  font-size:.72rem;
  opacity:.62;
  font-weight:400;
  letter-spacing:.01em;
  line-height:1.45;
}
#share-btn{
  flex-shrink:0;
  padding:7px 13px;
  border-radius:var(--radius-pill);
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:.72rem;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  letter-spacing:.02em;
  transition:background .15s ease;
}
#share-btn:hover{background:rgba(255,255,255,.18)}
#share-btn:active{transform:none}

/* ── Tabs ────────────────────────────────────────────── */
.tabs{
  display:flex;
  gap:2px;
  padding:8px 10px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;
  padding:9px 8px 10px;
  font-size:.7rem;
  font-weight:600;
  color:var(--ink-mute);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
  text-transform:uppercase;
  letter-spacing:.05em;
  text-align:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.tab:hover{color:var(--ink-soft)}
.tab:active{opacity:.72}
.tab.active{color:var(--accent-deep);border-bottom-color:var(--accent)}

/* ── Segmented weather / filters ─────────────────────── */
.weather-toggle{
  display:flex;
  gap:5px;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  align-items:center;
  background:var(--surface);
  overflow-x:auto;
  flex-wrap:nowrap;
  scrollbar-width:none;
}
.weather-toggle::-webkit-scrollbar{display:none}
.weather-toggle .label{font-size:.66rem;color:var(--ink-mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.wt-btn{
  padding:4px 10px;
  border-radius:var(--radius-pill);
  font-size:.68rem;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  transition:all .15s ease;
  background:var(--surface-2);
  color:var(--ink-soft);
  flex-shrink:0;
}
.wt-btn:hover{background:var(--paper-2)}
.wt-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.wt-btn.rain.active{background:#3f5c4c;border-color:#3f5c4c;color:#fff}
.wt-btn.dry.active{background:#9a6820;border-color:#9a6820;color:#fff}

.weather-toggle .sep{
  width:1px;height:16px;background:var(--line-strong);flex-shrink:0;margin:0 2px;
}
#filters{
  display:flex;
  gap:5px;
  flex-wrap:nowrap;
  align-items:center;
}
.filter-btn{
  padding:4px 10px;
  border-radius:var(--radius-pill);
  font-size:.68rem;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  transition:all .15s ease;
  background:var(--surface-2);
  white-space:nowrap;
  flex-shrink:0;
}
.filter-btn:hover{opacity:.85}
.filter-btn.active{opacity:1;box-shadow:none;filter:brightness(.92)}

.list-container{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:12px;
  scroll-behavior:smooth;
  contain:content;
}
.list-container::-webkit-scrollbar{width:8px}
.list-container::-webkit-scrollbar-thumb{background:rgba(70,45,20,.15);border-radius:8px}
.list-container::-webkit-scrollbar-track{background:transparent}

/* content swap on tab / filter change — only the first few rows, so long lists don't cascade */
.list-container > *:nth-child(-n+6){
  animation:listIn var(--dur-base) var(--ease-out) both;
}
@keyframes listIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}

/* ── Activity card ───────────────────────────────────── */
.activity-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:10px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color var(--dur-quick) ease, box-shadow var(--dur-quick) ease, transform var(--dur-press) var(--ease-press);
  box-shadow:0 1px 2px rgba(70,45,20,.04);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.activity-card:hover{
  border-color:rgba(196,122,62,.3);
  box-shadow:0 4px 14px rgba(70,45,20,.08);
}
.activity-card:active{transform:scale(.985)}
.activity-card.in-itinerary{border-color:rgba(63,92,76,.35);background:#f6faf7}
.activity-card .img-wrap{height:112px;overflow:hidden;position:relative;background:var(--paper-2)}
.activity-card .img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.activity-card .img-wrap .cat-badge{
  position:absolute;top:8px;left:8px;
  padding:2px 8px;border-radius:var(--radius-pill);
  font-size:.62rem;font-weight:700;color:#fff;
  text-transform:uppercase;letter-spacing:.04em;
  opacity:.92;
}
.activity-card .img-wrap .weather-badge{
  position:absolute;top:8px;right:8px;
  padding:2px 8px;border-radius:var(--radius-pill);
  font-size:.62rem;font-weight:600;
  background:rgba(255,255,255,.92);
  color:var(--ink-soft);
}
.activity-card .card-body{padding:11px 13px 12px}
.activity-card .card-body h3{
  font-family:'Fraunces',Georgia,serif;
  font-size:.98rem;
  color:var(--ink);
  margin-bottom:2px;
  letter-spacing:-.01em;
  font-weight:600;
}
.activity-card .card-body .meta{font-size:.72rem;color:var(--ink-mute);margin-bottom:5px;font-weight:500}
.activity-card .card-body p{font-size:.78rem;color:var(--ink-soft);line-height:1.45;margin-bottom:10px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.activity-card .card-actions{display:flex;gap:5px;align-items:center}

.btn-add{
  padding:5px 11px;
  border-radius:var(--radius-pill);
  font-size:.72rem;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  transition:transform var(--dur-press) var(--ease-press), background-color var(--dur-quick) ease, color var(--dur-quick) ease;
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.btn-add:hover{transform:translateY(-1px)}
.btn-add:active{transform:scale(.97)}
.btn-add.d1{background:var(--accent-soft);color:var(--accent-deep)}
.btn-add.d2{background:var(--green-soft);color:var(--green)}
.btn-add.d3{background:var(--blue-soft);color:var(--blue)}
.btn-add.remove{background:#fdeceb;color:#b54238}
.btn-show{
  padding:5px 11px;
  border-radius:var(--radius-pill);
  font-size:.72rem;
  font-weight:600;
  cursor:pointer;
  background:var(--surface-2);
  color:var(--ink-soft);
  border:1px solid var(--line);
  transition:all .15s ease;
}
.btn-show:hover{border-color:var(--line-strong);background:var(--surface)}

/* ── Presets ─────────────────────────────────────────── */
.preset-card{
  min-width:168px;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:border-color .18s ease, box-shadow .18s ease;
  background:var(--surface);
  box-shadow:0 1px 2px rgba(70,45,20,.04);
}
.preset-card:hover{border-color:rgba(196,122,62,.35);box-shadow:0 4px 14px rgba(70,45,20,.08)}
.preset-card h4{
  font-family:'Fraunces',Georgia,serif;
  font-size:.95rem;
  font-weight:600;
  color:var(--ink);
  margin-bottom:4px;
}
.preset-card p{font-size:.72rem;color:var(--ink-mute);line-height:1.45;margin-bottom:8px}
.preset-card .preset-emoji{font-size:1.35rem;margin-bottom:6px;display:block}

/* ── Itinerary ───────────────────────────────────────── */
.itinerary-day{margin-bottom:16px}
.itinerary-day-header{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;
  border-radius:12px;
  margin-bottom:8px;
  border:1px solid transparent;
  cursor:pointer;
  user-select:none;
  position:sticky;top:0;z-index:5;
}
.itinerary-day-header.d1{background:#faf0e2;border-color:rgba(196,122,62,.14)}
.itinerary-day-header.d2{background:#eaf2ec;border-color:rgba(63,92,76,.12)}
.itinerary-day-header.d3{background:#e8f0f5;border-color:rgba(74,111,138,.12)}
.itinerary-day-header .day-num{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.25rem;
  font-weight:700;
  color:rgba(44,34,24,.18);
  line-height:1;
}
.itinerary-day-header h3{
  font-family:'Fraunces',Georgia,serif;
  font-size:.92rem;
  font-weight:600;
  color:var(--ink);
  line-height:1.25;
}
.itinerary-day-header .total-time{
  margin-left:auto;
  font-size:.7rem;
  color:var(--ink-soft);
  font-weight:600;
  background:rgba(255,255,255,.6);
  padding:3px 9px;
  border-radius:var(--radius-pill);
  white-space:nowrap;
}
.itinerary-day-header .chev{
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;color:var(--ink-mute);
  transition:transform .18s ease;
}
.itinerary-day-header.collapsed .chev{transform:rotate(-90deg)}
.itinerary-day.collapsed-day .day-body{display:none}

.itin-stop{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:8px;
  overflow:hidden;
  transition:border-color var(--dur-quick) ease, box-shadow var(--dur-quick) ease, transform var(--dur-press) var(--ease-press);
  box-shadow:0 1px 2px rgba(70,45,20,.04);
}
.itin-stop:hover{box-shadow:0 4px 12px rgba(70,45,20,.08)}
.itin-stop:active{transform:scale(.99)}
.itin-stop.dragging{opacity:.45;transform:scale(.98)}
.itin-stop.drop-target{border-color:var(--accent);box-shadow:0 0 0 2px rgba(196,122,62,.2)}
.itin-stop .itin-top{display:flex;gap:10px;padding:10px 11px;cursor:pointer;position:relative}
.itin-stop .itin-img{
  width:84px;height:68px;object-fit:cover;
  border-radius:10px;flex-shrink:0;
  background:var(--paper-2);
}
.itin-stop .itin-num-overlay{
  position:absolute;top:8px;left:8px;
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;color:#fff;
  z-index:2;
}
.itin-stop .itin-info{flex:1;min-width:0}
.itin-stop .itin-info h4{
  font-family:'Fraunces',Georgia,serif;
  font-size:.92rem;
  color:var(--ink);
  margin-bottom:2px;
  font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.itin-stop .itin-info .itin-meta{font-size:.7rem;color:var(--ink-mute);margin-bottom:3px;font-weight:500}
.itin-stop .itin-info .itin-desc{
  font-size:.75rem;color:var(--ink-soft);line-height:1.4;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.itin-stop .itin-actions{display:flex;gap:5px;padding:0 11px 10px;align-items:center;flex-wrap:wrap}
.itin-stop .action-btn{
  padding:3px 9px;
  border-radius:var(--radius-pill);
  font-size:.68rem;font-weight:600;
  cursor:pointer;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-soft);
  transition:all .15s ease;
  font-family:inherit;
}
.itin-stop .action-btn:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
.itin-stop .itin-badges{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.itin-stop .itin-badges span{
  padding:2px 8px;
  border-radius:var(--radius-pill);
  font-size:.62rem;font-weight:600;
}
.move-btn{
  width:26px;height:26px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:var(--ink-mute);
  transition:all .16s ease;
}
.move-btn:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
.stop-remove{
  width:28px;height:28px;
  border-radius:50%;
  border:1px solid #f0cfc9;
  background:var(--surface);
  color:#c45448;
  cursor:pointer;
  font-size:.95rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .16s ease;
}
.stop-remove:hover{background:#fdeceb;transform:rotate(90deg)}
.drag-handle{
  width:28px;height:28px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-mute);
  cursor:grab;
  font-size:.95rem;
  letter-spacing:-2px;
  opacity:.55;
  transition:opacity .15s;
}
.drag-handle:hover{opacity:1}
.drag-handle:active{cursor:grabbing}

.travel-time{
  font-size:.72rem;
  color:var(--ink-mute);
  text-align:center;
  padding:6px 0;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:500;
}
.travel-time .line{flex:1;height:1px;background:var(--line-strong);max-width:80px}

.empty-day{
  padding:28px 16px;
  text-align:center;
  color:var(--ink-mute);
  font-size:.84rem;
  font-style:italic;
  background:var(--surface-2);
  border-radius:var(--radius);
  border:1px dashed var(--line-strong);
}

.itin-stop-add{
  display:flex;gap:6px;
  padding:10px;
  flex-wrap:wrap;justify-content:center;
  border-top:1px dashed var(--line);
  background:var(--surface-2);
}
.itin-stop-add .itin-add-btn{
  padding:5px 11px;
  border-radius:var(--radius-pill);
  font-size:.7rem;font-weight:600;
  cursor:pointer;
  border:1.5px solid transparent;
  transition:all .16s ease;
  background:var(--surface);
  font-family:inherit;
}
.itin-stop-add .itin-add-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-1)}

/* ── Search ──────────────────────────────────────────── */
.search-add{padding:10px 12px;border-bottom:1px solid var(--line)}
.search-add input{
  width:100%;
  padding:10px 14px;
  border-radius:var(--radius-pill);
  border:1.5px solid var(--line);
  font-family:inherit;
  font-size:.84rem;
  background:var(--surface-2);
  outline:none;
  transition:all .18s ease;
}
.search-add input:focus{
  border-color:var(--accent);
  background:var(--surface);
  box-shadow:0 0 0 4px rgba(196,122,62,.12);
}
.search-add input::placeholder{color:var(--ink-mute)}
.search-results{
  max-height:240px;overflow-y:auto;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.search-result{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;cursor:pointer;
  transition:background .15s;
}
.search-result:hover{background:var(--accent-soft)}
.search-result img{width:42px;height:32px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--paper-2)}
.search-result .sr-info{flex:1;min-width:0}
.search-result .sr-info .sr-name{font-size:.82rem;font-weight:600;color:var(--ink)}
.search-result .sr-info .sr-meta{font-size:.66rem;color:var(--ink-mute)}
.search-result .sr-day-btns{display:flex;gap:4px}
.search-result .sr-day-btns button{
  padding:3px 8px;
  border-radius:var(--radius-pill);
  font-size:.64rem;font-weight:600;
  cursor:pointer;
  border:1.5px solid transparent;
  font-family:inherit;
  transition:transform .12s;
}
.search-result .sr-day-btns button:hover{transform:scale(1.06)}

.day-label-edit{display:flex;gap:4px;align-items:center;margin-left:6px}
.day-label-edit input{
  width:110px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:8px;
  font-size:.72rem;
  font-family:inherit;
  outline:none;
  background:rgba(255,255,255,.4);
  transition:all .15s;
}
.day-label-edit input:focus{border-color:var(--accent);background:#fff}

/* ── Map ─────────────────────────────────────────────── */
#map-wrap{flex:1;position:relative;background:var(--paper-2)}
#map{width:100%;height:100%}
.map-controls{
  position:absolute;top:16px;right:16px;z-index:500;
  display:flex;flex-direction:column;gap:8px;
}
.map-ctrl-btn{
  width:42px;height:42px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,253,249,.92);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow-1);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;
  transition:all .16s ease;
  color:var(--ink-soft);
}
.map-ctrl-btn:hover{
  box-shadow:var(--shadow-2);
  transform:translateY(-1px);
  color:var(--accent-deep);
}
#map-legend{
  position:absolute;bottom:18px;left:18px;
  background:rgba(255,253,249,.92);
  backdrop-filter:blur(12px);
  border-radius:12px;
  padding:11px 13px;
  z-index:500;
  box-shadow:0 4px 16px rgba(70,45,20,.1);
  font-size:.7rem;
  border:1px solid var(--line);
  max-width:160px;
}
#map-legend h4{
  font-family:'Fraunces',Georgia,serif;
  font-size:.8rem;
  color:var(--ink);
  margin-bottom:5px;
  font-weight:600;
}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:2px;color:var(--ink-soft);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Popup ───────────────────────────────────────────── */
.leaflet-popup-content-wrapper{
  border-radius:18px!important;
  box-shadow:var(--shadow-3)!important;
  border:1px solid var(--line);
  padding:2px;
}
.leaflet-popup-content{
  margin:12px!important;
  font-family:'DM Sans',sans-serif!important;
  font-size:.84rem!important;
}
.popup-img{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:var(--paper-2)}
.popup-title{font-family:'Fraunces',Georgia,serif;font-size:1.05rem;color:var(--ink);margin-bottom:2px;font-weight:600}
.popup-meta{font-size:.72rem;color:var(--ink-mute);margin-bottom:6px;font-weight:500}
.popup-desc{font-size:.78rem;color:var(--ink-soft);margin-bottom:8px;line-height:1.45}
.popup-btn{
  padding:5px 12px;
  border-radius:var(--radius-pill);
  font-size:.72rem;font-weight:600;
  cursor:pointer;border:none;
  transition:all .15s;
  font-family:inherit;
}
.popup-btn:hover{transform:translateY(-1px)}

/* ── Modals ──────────────────────────────────────────── */
.modal{
  display:none;position:fixed;top:0;left:0;
  width:100%;height:100%;
  background:rgba(44,34,24,.42);
  backdrop-filter:blur(6px);
  z-index:1000;
  align-items:center;justify-content:center;
  animation:fadeIn .18s ease;
}
.modal.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.detail-content{
  background:var(--surface);
  border-radius:24px;
  width:480px;max-width:92vw;
  max-height:88vh;overflow-y:auto;
  position:relative;
  box-shadow:var(--shadow-3);
  animation:popIn .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.detail-content .detail-img{
  width:100%;height:230px;object-fit:cover;
  border-radius:24px 24px 0 0;
  background:var(--paper-2);
  cursor:zoom-in;
}
.detail-content .detail-body{padding:22px 24px 24px}
.detail-content .detail-body h2{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.45rem;
  color:var(--ink);
  margin-bottom:4px;
  letter-spacing:-.02em;
  font-weight:600;
}
.detail-content .detail-body .detail-meta{font-size:.82rem;color:var(--ink-mute);margin-bottom:12px;font-weight:500}
.detail-content .detail-body p{font-size:.92rem;color:var(--ink-soft);line-height:1.7;margin-bottom:16px}
.detail-content .detail-body .detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.detail-content .detail-body .detail-tags span{
  padding:4px 10px;
  border-radius:var(--radius-pill);
  font-size:.72rem;font-weight:600;
}
.detail-close{
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(255,253,249,.92);
  border:none;font-size:1.15rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
  box-shadow:var(--shadow-1);
  transition:all .15s;
}
.detail-close:hover{transform:rotate(90deg);background:#fff}
.detail-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.detail-actions .btn-add{flex:1;min-width:90px;padding:11px 14px;font-size:.82rem;border-radius:14px}

/* Lightbox */
#lightbox{
  display:none;position:fixed;inset:0;
  background:rgba(20,14,8,.88);
  z-index:1100;
  align-items:center;justify-content:center;
  cursor:zoom-out;
}
#lightbox.open{display:flex}
#lightbox img{
  max-width:92vw;max-height:88vh;
  border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

/* Share modal extras */
.share-option{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:var(--surface-2);
  cursor:pointer;
  transition:all .18s ease;
  font-family:inherit;
  text-align:left;
  width:100%;
}
.share-option:hover{
  border-color:rgba(196,122,62,.4);
  background:var(--surface);
  transform:translateY(-1px);
  box-shadow:var(--shadow-1);
}
.share-option .icon{
  width:40px;height:40px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;
  flex-shrink:0;
}
.share-option .text strong{display:block;font-size:.88rem;color:var(--ink);margin-bottom:1px}
.share-option .text span{font-size:.72rem;color:var(--ink-mute);line-height:1.4}

/* Toast */
#toast{
  position:fixed;
  bottom:28px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);
  color:#fff;
  padding:12px 22px;
  border-radius:var(--radius-pill);
  font-size:.84rem;
  font-weight:500;
  box-shadow:var(--shadow-3);
  opacity:0;
  pointer-events:none;
  transition:all .28s cubic-bezier(.2,.9,.3,1);
  z-index:1200;
  max-width:80vw;
  text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Marker pulse */
.pulse-ring{
  position:absolute;
  width:28px;height:28px;
  border-radius:50%;
  animation:pulse 2s ease-out infinite;
  pointer-events:none;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:.55}
  100%{transform:scale(2.1);opacity:0}
}

/* ── Mobile view toggle ──────────────────────────────── */
#mobile-toggle{
  display:none;
  position:fixed;
  bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  left:50%;
  transform:translateX(-50%);
  z-index:900;
  background:rgba(44,34,24,.92);
  color:#fff;
  border-radius:999px;
  padding:5px;
  gap:4px;
  box-shadow:0 8px 28px rgba(30,20,10,.28);
}
#mobile-toggle button{
  border:none;
  background:transparent;
  color:rgba(255,255,255,.72);
  font-family:inherit;
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.03em;
  padding:10px 18px;
  border-radius:999px;
  cursor:pointer;
  min-height:40px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), transform var(--dur-press) var(--ease-press);
}
#mobile-toggle button:active{transform:scale(.96)}
#mobile-toggle button.active{
  background:#fff;
  color:var(--ink);
}

.itin-time{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:1px}
.itin-note{font-size:.78rem;color:var(--ink-soft);line-height:1.4;margin:3px 0 4px}
.itin-links{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 4px}
.itin-links a{font-size:.74rem;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:7px 11px;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
a.action-btn{text-decoration:none;display:inline-flex;align-items:center}
.itin-pick{width:100%;margin:5px 0 4px;font:600 .85rem 'DM Sans',sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-height:44px}
.rain-strip{
  margin:8px 12px 12px;border-radius:14px;border:1px dashed rgba(79,143,98,.35);
  background:rgba(79,143,98,.07);overflow:hidden;
}
.rain-strip summary{
  cursor:pointer;list-style:none;padding:11px 14px;font-size:.82rem;font-weight:600;
  color:#3f5c4c;display:flex;align-items:center;gap:8px;min-height:44px;
}
.rain-strip summary::-webkit-details-marker{display:none}
.rain-strip summary::before{content:"*";font-size:.95rem}
.rain-swap{
  display:flex;gap:10px;align-items:flex-start;padding:10px 14px;
  border-top:1px solid rgba(79,143,98,.15);font-size:.8rem;color:var(--ink);
}
.rain-swap .why{color:var(--ink-mute);line-height:1.4;margin-top:2px}
.rain-swap button{
  flex-shrink:0;border:1px solid #3f5c4c;color:#3f5c4c;background:#e4eee7;
  border-radius:999px;padding:8px 12px;font-size:.75rem;font-weight:600;
  cursor:pointer;min-height:36px;
}
.rain-swap button:disabled{opacity:.4;cursor:default}
.rain-swap button:hover:not(:disabled){background:#3f5c4c;color:#fff}

/* Responsive */
@media(max-width:900px){
  html,body{
    height:100%;
    height:100dvh;
    overflow:hidden;
    position:fixed;
    inset:0;
    width:100%;
  }
  #app{flex-direction:column;height:100dvh;overflow:hidden}
  #sidebar{
    width:100%;
    min-width:0;
    flex:1 1 auto;
    min-height:0;
    height:auto;
    border-right:none;
    box-shadow:none;
    overflow:hidden;
  }
  #map-wrap{
    display:none;
    width:100%;
    height:100dvh;
    flex:1 1 auto;
    min-height:0;
    opacity:0;
    transition:opacity var(--dur-base) var(--ease-out);
  }
  #app.show-map #sidebar{
    display:none;
  }
  #app.show-map #map-wrap{
    display:block;
    opacity:1;
  }
  #sidebar{
    transition:opacity var(--dur-base) var(--ease-out);
  }

  #mobile-toggle{display:flex}

  #sidebar-header{
    padding:12px 14px 12px;
    padding-top:calc(12px + env(safe-area-inset-top, 0px));
    flex-shrink:0;
  }
  #sidebar-header h1{font-size:1.05rem}
  #sidebar-header p{font-size:.68rem}

  .tabs{padding:0 8px;flex-shrink:0}
  .tab{padding:11px 6px 12px;min-height:44px}

  .weather-toggle{
    padding:8px 10px;
    gap:6px;
    flex-shrink:0;
    -webkit-overflow-scrolling:touch;
  }
  .wt-btn,.filter-btn{
    padding:8px 12px;
    min-height:36px;
    font-size:.72rem;
  }

  .list-container{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:12px 12px calc(84px + env(safe-area-inset-bottom, 0px));
    /* momentum scrolling on iOS */
    touch-action:pan-y;
  }

  .activity-card{margin-bottom:12px}
  .activity-card .img-wrap{height:150px}
  .activity-card .card-body{padding:12px 14px 14px}
  .btn-add{padding:10px 14px;min-height:40px;font-size:.76rem}

  .itin-stop .action-btn{padding:8px 12px;min-height:36px}
  .move-btn,.stop-remove{width:36px;height:36px}
  .drag-handle{width:36px;height:36px}

  .itinerary-day-header{
    flex-wrap:wrap;
    gap:6px 10px;
    padding:12px;
  }
  .itinerary-day-header h3{
    font-size:.88rem;
    flex:1 1 auto;
    min-width:0;
  }
  .itinerary-day-header .day-num{font-size:1.1rem}
  .itinerary-day-header .total-time{
    margin-left:0;
    order:3;
    width:100%;
    text-align:left;
    background:transparent;
    padding:0;
  }
  .itinerary-day-header .chev{
    margin-left:auto;
    order:2;
  }

  /* Modals → full-screen sheets */
  .modal{align-items:stretch}
  .detail-content{
    width:100%;
    max-width:100%;
    height:100%;
    max-height:100%;
    border-radius:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .detail-content .detail-img{
    height:210px;
    border-radius:0;
  }
  .detail-content .detail-body{
    padding:18px 16px 28px;
  }
  .detail-close{
    top:calc(12px + env(safe-area-inset-top, 0px))!important;
    right:12px!important;
  }

  #map-legend{
    bottom:calc(78px + env(safe-area-inset-bottom, 0px));
    left:10px;
    padding:9px 11px;
    max-width:132px;
    font-size:.65rem;
  }
  .map-controls{
    top:calc(12px + env(safe-area-inset-top, 0px));
    right:12px;
  }
  .map-ctrl-btn{width:44px;height:44px}

  #toast{
    bottom:calc(88px + env(safe-area-inset-bottom, 0px));
    width:max-content;
    max-width:min(88vw, 420px);
    font-size:.78rem;
    padding:11px 16px;
  }

  /* Share modal sits above the toggle */
  #share-modal .detail-content{
    height:auto;
    max-height:92dvh;
    width:100%;
    border-radius:20px 20px 0 0;
    margin-top:auto;
    padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  }
  #share-modal{align-items:flex-end}
}

@media(max-width:420px){
  #sidebar-header p{display:none}
  .activity-card .card-body p{
    -webkit-line-clamp:2;
  }
  .itin-stop .itin-desc{display:none}
}

<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="brand-row">
        <div class="brand">
          <h1>UK Road Trip</h1>
          <p>Cotswolds · Bath — 20–22 Nov 2026</p>
        </div>
        <button id="share-btn" onclick="openShare()">Share</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="explore">Explore</div>
      <div class="tab active" data-tab="itinerary">Itinerary</div>
      <div class="tab" data-tab="presets">Ideas</div>
    </div>
    <div class="weather-toggle" id="weather-bar">
      <div class="wt-btn all active" data-weather="all">All</div>
      <div class="wt-btn rain" data-weather="rain">Wet weather</div>
      <div class="wt-btn dry" data-weather="dry">Dry</div>
      <div class="sep"></div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="list-container" id="list-container"></div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-controls">
      <button class="map-ctrl-btn" onclick="fitRoute()" title="Fit route">⤢</button>
      <button class="map-ctrl-btn" onclick="showAllMarkers()" title="Show all">◉</button>
    </div>
    <div id="map-legend">
      <h4>Legend</h4>
      <div class="legend-item"><div class="legend-dot" style="background:var(--waterfall)"></div> Waterfall</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--hike)"></div> Hike</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--viewpoint)"></div> Viewpoint</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--village)"></div> Village</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--pub)"></div> Pub / Food</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--abbey)"></div> Abbey / Ruin</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--drive)"></div> Scenic Drive</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--activity)"></div> Activity</div>
    </div>
  </div>
</div>

<div class="modal" id="detail-modal">
  <div class="detail-content">
    <button class="detail-close" onclick="closeDetail()">×</button>
    <img class="detail-img" id="detail-img" src="" alt="" onclick="openLightbox(this.src)">
    <div class="detail-body">
      <h2 id="detail-title"></h2>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-tags" id="detail-tags"></div>
      <p id="detail-desc"></p>
      <div class="detail-actions" id="detail-actions"></div>
    </div>
  </div>
</div>

<div class="modal" id="share-modal">
  <div class="detail-content" style="width:420px">
    <button class="detail-close" onclick="closeShare()">×</button>
    <div class="detail-body">
      <h2>Share this trip</h2>
      <div class="detail-meta">Send the plan — link, file, or a quick message</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <button class="share-option" onclick="copyShortLink()">
          <div class="icon" style="background:var(--accent-soft)">🔗</div>
          <div class="text"><strong>Copy short link</strong><span>~25 characters — best for texts &amp; DMs</span></div>
        </button>
        <button class="share-option" onclick="copyShareLink()">
          <div class="icon" style="background:var(--green-soft)">📎</div>
          <div class="text"><strong>Copy full link</strong><span>Self-contained — works even if a shortener is down</span></div>
        </button>
        <button class="share-option" onclick="downloadShareHTML()">
          <div class="icon" style="background:var(--blue-soft)">📥</div>
          <div class="text"><strong>Download page</strong><span>Offline HTML — AirDrop, iMessage, email</span></div>
        </button>
        <button class="share-option" onclick="copyShareText()">
          <div class="icon" style="background:var(--paper-2)">📋</div>
          <div class="text"><strong>Copy as message</strong><span>Plain text for WhatsApp or notes</span></div>
        </button>
      </div>
      <p id="share-status" style="margin-top:12px;font-size:.78rem;color:var(--green);min-height:1.3em;line-height:1.5"></p>
    </div>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt=""></div>
<div id="toast"></div>
<div id="mobile-toggle" role="tablist" aria-label="View">
  <button id="mt-list" class="active" onclick="setMobileView('list')" type="button">List</button>
  <button id="mt-map" onclick="setMobileView('map')" type="button">Map</button>
</div>

  {id:"tintern",name:"Tintern Abbey",cat:"abbey",lat:51.6967,lng:-2.6772,region:"Wye Valley",wiki:"Tintern_Abbey",weather:"rain-ok",duration:"1-2 hrs",rating:4.7,desc:"Cistercian abbey ruins in the Wye Valley. Gothic arches open to the sky. Hauntingly beautiful in grey light.",tips:"Free exterior. ~£10 for interior."},
  {id:"goodrich",name:"Goodrich Castle",cat:"abbey",lat:51.8592,lng:-2.6228,region:"Wye Valley",wiki:"Goodrich_Castle",weather:"rain-ok",duration:"1-2 hrs",rating:4.5,desc:"One of the best-preserved medieval castles in England. English Heritage. Views over the Wye.",tips:"Lots to explore indoors. Good tea room."},
  {id:"sarahs-bridge",name:"The Saracens Head",cat:"pub",lat:51.8410,lng:-2.6400,region:"Wye Valley",wiki:"River_Wye",weather:"rain-ok",duration:"1-2 hrs",rating:4.5,desc:"Fire-lit riverside pub at Symonds Yat. One of the best lunch stops in the valley. Window tables have river views.",tips:"Sunday roast is excellent. Book a window seat."},

  // BLACK MOUNTAINS
  {id:"hay",name:"Hay-on-Wye",cat:"village",lat:52.0767,lng:-3.1269,region:"Black Mountains",wiki:"Hay-on-Wye",weather:"rain-ok",duration:"2-3 hrs",rating:4.6,desc:"The 'Town of Books' — over 20 independent bookshops. Castle ruins, riverside walks, lovely cafés.",tips:"Perfect rainy-day destination. Richard Booth's and Murder & Mayhem are highlights."},
  {id:"hay-river",name:"Hay Riverside Walk",cat:"hike",lat:52.0770,lng:-3.1200,region:"Black Mountains",wiki:"Wye_Valley",weather:"either",duration:"1 hr",rating:4.3,desc:"A gentle walk along the River Wye from Hay. Peaceful, flat, lovely views of the Black Mountains foothills.",tips:"Nice easy walk before or after bookshops."},
  {id:"hay-bluff",name:"Hay Bluff & Twmpa",cat:"hike",lat:52.0350,lng:-3.1050,region:"Black Mountains",wiki:"Hay_Bluff",weather:"dry",duration:"3-4 hrs",rating:4.8,desc:"The classic Black Mountains ridge walk. 4-5 miles along Offa's Dyke with huge views into England and Wales.",tips:"Exposed ridge — skip in high wind or heavy rain. Stunning on a clear day."},
  {id:"cats-back",name:"The Cat's Back",cat:"hike",lat:51.9700,lng:-3.0500,region:"Black Mountains",wiki:"Offa%27s_Dyke_Path",weather:"dry",duration:"2-3 hrs",rating:4.9,desc:"A thrilling knife-edge ridge walk with steep drops both sides. One of the best ridge walks in Wales. 4 miles.",tips:"Not for vertigo sufferers! Best in clear weather."},
  {id:"gospel-pass",name:"Gospel Pass Drive",cat:"drive",lat:52.0100,lng:-3.0800,region:"Black Mountains",wiki:"Gospel_Pass",weather:"dry",duration:"1-2 hrs",rating:4.9,desc:"The highest road in Wales (549m). Winding mountain pass from Hay into the Vale of Ewyas. Spectacular views.",tips:"Fill up petrol before! Not suitable in ice or fog."},
  {id:"llanthony",name:"Llanthony Priory",cat:"abbey",lat:51.9430,lng:-3.0350,region:"Black Mountains",wiki:"Llanthony_Priory",weather:"either",duration:"1-2 hrs",rating:4.7,desc:"Half-ruined medieval priory in a remote mountain valley. Have a pint in the priory bar among the medieval walls.",tips:"Very atmospheric in mist. The priory bar is a unique experience."},
  {id:"llanthony-walk",name:"Vale of Ewyas Walk",cat:"hike",lat:51.9400,lng:-3.0400,region:"Black Mountains",wiki:"Vale_of_Ewyas",weather:"either",duration:"2-3 hrs",rating:4.5,desc:"Walk up the remote Vale of Ewyas to the ruined priory. Surrounded by the Black Mountains. Very atmospheric.",tips:"A gentle valley walk with big mountain scenery."},
  {id:"sugar-loaf",name:"Sugar Loaf Mountain",cat:"hike",lat:51.8750,lng:-3.0300,region:"Black Mountains",wiki:"Abergavenny",weather:"dry",duration:"1-2 hrs",rating:4.5,desc:"A conical hill near Abergavenny with 360° panoramic views. About 1 hour up. Great sunset spot.",tips:"Short but rewarding. Start from the car park near Abergavenny."},
  {id:"crickhowell",name:"Crickhowell",cat:"village",lat:51.8580,lng:-3.1370,region:"Black Mountains",wiki:"Crickhowell",weather:"either",duration:"1-2 hrs",rating:4.5,desc:"A lovely market town with a bridge over the Usk. Great independent shops and pubs. The Bear Hotel is a highlight.",tips:"Nice relaxed lunch stop. The Bear Hotel has excellent food."},

  // BRECON BEACONS / WATERFALL COUNTRY
  {id:"waterfall-country",name:"Waterfall Country",cat:"waterfall",lat:51.7750,lng:-3.5800,region:"Brecon Beacons",wiki:"Nedd_Fechan",weather:"rain-ok",duration:"2-4 hrs",rating:4.9,desc:"A series of stunning waterfalls in the Brecon Beacons. At their BEST in autumn rain — powerful, dramatic, unforgettable.",tips:"Wear waterproofs! Paths can be slippery. November is peak flow."},
  {id:"sgwd-yr-eira",name:"Sgwd yr Eira (Walk Behind!)",cat:"waterfall",lat:51.7820,lng:-3.5850,region:"Brecon Beacons",wiki:"Afon_Hepste",weather:"rain-ok",duration:"1-2 hrs",rating:5.0,desc:"Walk BEHIND a waterfall. The path goes directly behind the curtain of water. One of the most magical experiences in Wales.",tips:"You WILL get wet. Bring waterproofs and a sense of adventure."},
  {id:"four-falls",name:"Four Falls Walk",cat:"waterfall",lat:51.7780,lng:-3.5750,region:"Brecon Beacons",wiki:"Pontneddfechan",weather:"rain-ok",duration:"3-4 hrs",rating:4.8,desc:"A 4-5 mile walk past four major waterfalls. Each one is different and spectacular.",tips:"The best waterfall walk in Wales. Start from Ystradfellte car park."},
  {id:"henryhd",name:"Henryhd Waterfall",cat:"waterfall",lat:51.7680,lng:-3.4500,region:"Brecon Beacons",wiki:"Henrhyd_Falls",weather:"rain-ok",duration:"30-60 min",rating:4.5,desc:"The tallest single-drop waterfall in Wales (90ft). Short 1-mile walk from the car park.",tips:"Quick and easy — great for a waterfall fix without a long hike."},
  {id:"llyn-y-fan",name:"Llyn y Fan Fach",cat:"hike",lat:51.8750,lng:-3.6800,region:"Brecon Beacons",wiki:"Llyn_y_Fan_Fach",weather:"dry",duration:"2-3 hrs",rating:4.8,desc:"A glacial lake in the western Brecon Beacons. Setting of the Welsh 'Lady of the Lake' legend. Fairy-tale mountain lake.",tips:"About 1.5 hours up. Stunning in autumn with mist rolling over ridges."},
  {id:"pen-y-fan",name:"Pen y Fan",cat:"hike",lat:51.8840,lng:-3.4380,region:"Brecon Beacons",wiki:"Pen_y_Fan",weather:"dry",duration:"3-4 hrs",rating:4.7,desc:"The highest peak in southern Britain (886m). 5 miles return from Pont ar Daf. Huge summit views.",tips:"Cold and windy at summit. Check conditions. Start early."},
  {id:"penderyn",name:"Penderyn Distillery",cat:"activity",lat:51.7720,lng:-3.5150,region:"Brecon Beacons",wiki:"Penderyn_distillery",weather:"rain-ok",duration:"1-2 hrs",rating:4.3,desc:"Welsh whisky distillery with tours and tastings. A great rainy-day option.",tips:"Book a tour in advance. Good gift shop."},
  {id:"dan-yr-ogof",name:"Dan yr Ogof Caves",cat:"activity",lat:51.8250,lng:-3.6700,region:"Brecon Beacons",wiki:"Brecon_Beacons_National_Park",weather:"rain-ok",duration:"2-3 hrs",rating:4.0,desc:"A massive show cave system. Underground waterfalls, dramatic chambers. Entirely undercover.",tips:"Perfect for a complete washout day."},

  // FOREST OF DEAN
  {id:"puzzlewood",name:"Puzzlewood",cat:"hike",lat:51.7840,lng:-2.6200,region:"Forest of Dean",wiki:"Puzzlewood",weather:"either",duration:"1-2 hrs",rating:4.8,desc:"An ancient woodland with moss-covered rocks, twisted trees, and winding paths. Used as a filming location for Star Wars, Doctor Who, and Merlin. Genuinely magical.",tips:"Feels like stepping into a fantasy world. Paths can be muddy. Small entry fee."},
  {id:"cannop-ponds",name:"Cannop Ponds",cat:"hike",lat:51.7800,lng:-2.5600,region:"Forest of Dean",wiki:"Cannop_Ponds",weather:"either",duration:"1-2 hrs",rating:4.4,desc:"Two lakes in the heart of the Forest of Dean. Easy woodland walk. Mandarin ducks, dragonflies, and beautiful reflections in autumn.",tips:"Gentle flat walk around the ponds. Combined with Puzzlewood for a Forest of Dean half-day."},
  {id:"the-kymin",name:"The Kymin",cat:"viewpoint",lat:51.8130,lng:-2.6900,region:"Wye Valley",wiki:"The_Kymin",weather:"dry",duration:"30-60 min",rating:4.5,desc:"A hilltop viewpoint above Monmouth with 360° views across the Wye Valley, the Brecon Beacons, and the Malvern Hills. A small Roundhouse and Naval Temple at the top.",tips:"Short walk from the car park. One of the best viewpoints in the Wye Valley."},
  {id:"ross-on-wye",name:"Ross-on-Wye",cat:"village",lat:51.9140,lng:-2.5870,region:"Wye Valley",wiki:"Ross-on-Wye",weather:"either",duration:"1-2 hrs",rating:4.3,desc:"A market town perched on a cliff above the River Wye. Panoramic views from the Prospect gardens. The starting point of the original 'Wye Tour'.",tips:"Nice lunch stop. The Prospect has stunning river views."},
  {id:"skirrid",name:"Ysgyryd Fawr (The Skirrid)",cat:"hike",lat:51.8420,lng:-2.9600,region:"Black Mountains",wiki:"Skirrid_Fawr",weather:"dry",duration:"1-2 hrs",rating:4.6,desc:"A dramatic lone hill near Abergavenny with a rocky, craggy summit. One of the most distinctive peaks in the Black Mountains. About 45 minutes up. Big views from the top.",tips:"Short but steep. The rocky summit is exciting. Start from the car park on the minor road."},
  {id:"pontsticill",name:"Pontsticill Reservoir",cat:"hike",lat:51.8600,lng:-3.3700,region:"Brecon Beacons",wiki:"Pontsticill_Reservoir",weather:"either",duration:"1-2 hrs",rating:4.3,desc:"A large reservoir at the foot of the Brecon Beacons. Easy flat walk along the water with Pen y Fan and the Beacons as a backdrop. Beautiful reflections.",tips:"Gentle and accessible. Good alternative if the mountain summits are clagged in."},
  {id:"sgwd-ddwli",name:"Sgwd Ddwli (Waterfall)",cat:"waterfall",lat:51.7770,lng:-3.5780,region:"Brecon Beacons",wiki:"Ystradfellte",weather:"rain-ok",duration:"1-2 hrs",rating:4.6,desc:"A wide, powerful waterfall in Waterfall Country. Less visited than Sgwd yr Eira but equally impressive. A shorter walk from the car park.",tips:"A good option if you want a waterfall without the longer Four Falls walk."},
  {id:"clearwell-caves",name:"Clearwell Caves",cat:"activity",lat:51.7740,lng:-2.6100,region:"Forest of Dean",wiki:"Clearwell_Caves",weather:"rain-ok",duration:"1-2 hrs",rating:4.1,desc:"Ancient iron mines open to the public. Walk through atmospheric underground caverns. Used as a filming location for Doctor Who and Sherlock.",tips:"Entirely underground — perfect for rain. Combined with Puzzlewood for a Forest of Dean day."},

  // PUBS & FOOD
  {id:"wild-rabbit",name:"The Wild Rabbit",cat:"pub",lat:51.8750,lng:-1.6000,region:"Cotswolds",wiki:"Kingham",weather:"rain-ok",duration:"2-3 hrs",rating:4.8,desc:"The best food in the Cotswolds. Gastropub in Kingham with seasonal menu and roaring fire.",tips:"Book well in advance. The tasting menu is exceptional."},
  {id:"old-black-lion",name:"The Old Black Lion",cat:"pub",lat:52.0760,lng:-3.1280,region:"Black Mountains",wiki:"Hay_Castle",weather:"rain-ok",duration:"2-3 hrs",rating:4.6,desc:"17th-century coaching inn in Hay. Candlelit dining room, log fires. The most romantic dinner spot in Hay.",tips:"Book for dinner. Try the Welsh lamb."},
  // COTSWOLDS (appended — share links index into A)
  {id:"cirencester",name:"Cirencester",cat:"village",lat:51.7189,lng:-1.9680,region:"Cotswolds",wiki:"Cirencester",weather:"rain-ok",duration:"2-3 hrs",rating:4.4,desc:"The 'Capital of the Cotswolds' — honey-stone market town with the Corinium Museum (Roman mosaics, great in rain), a market square, and independent shops.",tips:"Park in the Abbey Grounds car park. Corinium Museum if the weather turns."},
  {id:"arlington-row",name:"Arlington Row",cat:"village",lat:51.7599,lng:-1.8342,region:"Cotswolds",wiki:"Arlington_Row",weather:"either",duration:"30-60 min",rating:4.9,desc:"The most photographed street in England — a steep row of 14th-century weavers' cottages climbing the hillside. Crooked gables, low doorways, tiny gardens.",tips:"Arrive before 10am or after 4pm to avoid coach groups. Short walk from the Bibury car park."},
  // COTSWOLDS BASE + DAY TRIPS (appended — share links index into A)
  {id:"stay-cerney",name:"Your stay — South Cerney",cat:"stay",lat:51.6700,lng:-1.9327,region:"South Cerney",wiki:"South_Cerney",weather:"rain-ok",duration:"2 nights",rating:4.5,desc:"Home base for Fri and Sat night, on the edge of the Cotswold Water Park lakes — 15 minutes from Cirencester and about an hour from Bath.",tips:"Pin is the village centre. Checkout is 10am Sunday."},
  {id:"cerney-lake",name:"South Cerney Lake Walk",cat:"hike",lat:51.6650,lng:-1.9120,region:"South Cerney",wiki:"Cotswold_Water_Park",weather:"either",duration:"1-2 hrs",rating:4.3,desc:"Flat loop around the flooded gravel pits of the Cotswold Water Park on your doorstep — still water, reeds, wildfowl and big skies. Beautiful at sunrise or in low winter light.",tips:"Easy and flat, but paths can be muddy after rain. Fri late afternoon (golden hour, dusk ~4pm) or Sun before the 10am checkout."},
  {id:"stow",name:"Stow-on-the-Wold (park here)",cat:"village",lat:51.9305,lng:-1.7243,region:"Cotswolds",wiki:"Stow-on-the-Wold",weather:"either",duration:"30-60 min",rating:4.4,desc:"Highest town in the Cotswolds — market square, antique shops, the famous yew-flanked door at St Edward's church. A good place to leave the car and walk down to the Slaughters.",tips:"Park at the Market Square or Fosse Way car park. Walk Stow → Lower Slaughter is roughly 2 miles on footpaths; check the route on OS Maps or AllTrails and allow for mud."},
  {id:"wild-thyme",name:"Wild Thyme & Honey, Ampney Crucis",cat:"pub",lat:51.7150,lng:-1.8740,region:"Cotswolds",wiki:"Ampney_Crucis",weather:"rain-ok",duration:"1.5-2 hrs",rating:4.6,desc:"Sunday roast stop in Ampney Crucis, Cirencester GL7 5RS — five minutes from the Bibury road, exactly on the way back towards London.",tips:"No availability until 2:45pm on Sunday per your check — so build the day around it: Cirencester late morning, Bibury, then lunch at 2:45. Phone to ask about cancellations or a bar table earlier."},
  {id:"tetbury",name:"Tetbury",cat:"village",lat:51.6370,lng:-2.1590,region:"Cotswolds",wiki:"Tetbury",weather:"rain-ok",duration:"1-2 hrs",rating:4.3,desc:"Elegant market town of antique shops, galleries and the covered Market House. Easy to browse in the rain.",tips:"A dry-roofed Plan B for Sunday morning, 20 min from South Cerney."},
  {id:"chedworth",name:"Chedworth Roman Villa",cat:"activity",lat:51.8052,lng:-1.9514,region:"Cotswolds",wiki:"Chedworth_Roman_Villa",weather:"rain-ok",duration:"1-2 hrs",rating:4.5,desc:"One of the largest Roman villas in Britain, with remarkable mosaics and a hypocaust, in a wooded valley. National Trust.",tips:"Winter opening is limited — check the National Trust page for 20–22 Nov before relying on it."},
  {id:"castle-combe",name:"Castle Combe",cat:"village",lat:51.4934,lng:-2.2279,region:"Wiltshire",wiki:"Castle_Combe",weather:"either",duration:"1 hr",rating:4.6,desc:"Postcard honey-stone village with a bridge over the By Brook — often called the prettiest village in England. About 25 minutes from Bath on the way home.",tips:"Optional Saturday add-on if you leave Bath by 2:30; light is gone by about 4pm."},
  // BATH
  {id:"bath-alexandra",name:"Alexandra Park Viewpoint",cat:"viewpoint",lat:51.3713,lng:-2.3623,region:"Bath",wiki:"Alexandra_Park,_Bath",weather:"dry",duration:"45 min",rating:4.8,desc:"The classic panorama over the whole of Bath — the Abbey, the Crescent and the city bowl laid out below. Best on a clear sunny day, and a lovely sunset spot.",tips:"Saturday is the sunnier day — time it for golden hour (sunset ~4:00pm). Drive up, or walk the steep climb from Oldfield Park."},
  {id:"bath-crescent",name:"Royal Crescent & The Circus",cat:"village",lat:51.3869,lng:-2.3667,region:"Bath",wiki:"Royal_Crescent",weather:"either",duration:"1 hr",rating:4.8,desc:"Bath's two great Georgian set-pieces: the sweeping Royal Crescent and the round, perfectly proportioned Circus a few minutes away. Walk the lawn side for the full curve.",tips:"Stroll through Royal Victoria Park next door. Best in morning light."},
  {id:"bath-guildhall",name:"Guildhall Market",cat:"village",lat:51.3820,lng:-2.3592,region:"Bath",wiki:"Guildhall,_Bath",weather:"rain-ok",duration:"45 min",rating:4.4,desc:"Covered market, trading for 800 years — food stalls, delis, vintage and independent traders right by the Abbey and Pulteney Bridge.",tips:"A good wet-weather pocket and a handy lunch/snack stop."},
  {id:"bath-weir",name:"Pulteney Bridge & Weir",cat:"viewpoint",lat:51.3817,lng:-2.3556,region:"Bath",wiki:"Pulteney_Bridge",weather:"dry",duration:"30 min",rating:4.7,desc:"Palladian Pulteney Bridge with its shops, and the curved horseshoe weir just below — best seen from the Parade Gardens or Grand Parade.",tips:"Walk along the riverside path below the weir for the postcard view."},
  {id:"bath-cafe",name:"Colonna & Smalls (coffee)",cat:"pub",lat:51.3875,lng:-2.3636,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"45 min",rating:4.7,desc:"Specialty coffee roaster on Chapel Row, a short walk from Queen Square and the Circus — small, warm, and a favourite with locals. My suggestion for the 'nice cafe' slot.",tips:"Tiny room — go mid-morning or mid-afternoon. Alternatives: Fine Cheese Co. cafe or Sally Lunn's for the famous bun. Verify opening hours."},
  {id:"bath-chilli",name:"Chilli Family Noodles (cash only)",cat:"pub",lat:51.3775,lng:-2.3573,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1 hr",rating:4.5,desc:"Sichuan noodles inside Bath's bus station, 1 Dorchester Street BA1 1SS. Fiery, cheap, and a cult favourite.",tips:"Cash only per most listings — bring notes. Ideal for a quick, hot lunch."},
  {id:"bath-sarthi",name:"Sarthi",cat:"pub",lat:51.3860,lng:-2.3578,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1.5-2 hrs",rating:4.5,desc:"Vegetarian/vegan-leaning Indian restaurant in a restored Methodist church, 88 Walcot Street BA1 5BD. Atmospheric for a couple's dinner.",tips:"Book ahead for Saturday evening (01225 462992)."},
  {id:"bath-angelos",name:"Angelo's",cat:"pub",lat:51.3814,lng:-2.3598,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1-2 hrs",rating:4.3,desc:"The only Angelo's I could verify in central Bath is Angelos Bakery at 15 Cheap Street BA1 1NA (bakery/takeaway) — if you meant a sit-down Angelo's, check the address.",tips:"Pin is placed on Cheap Street. Confirm which Angelo's you mean before you commit."},
  {id:"bath-yakyeti",name:"Yak Yeti Yak",cat:"pub",lat:51.3796,lng:-2.3578,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1.5 hrs",rating:4.5,desc:"Long-running Nepalese restaurant at 12 Pierrepont Street BA1 1LA with low cushioned seating in the basement. Cosy for two.",tips:"Book on ResDiary or call 01225 442299. Opium cocktail bar is a few steps away."},
  {id:"bath-jars",name:"Jars Meze",cat:"pub",lat:51.3825,lng:-2.3598,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1.5 hrs",rating:4.5,desc:"Small-plates Mediterranean/Turkish meze at 6 Northumberland Place BA1 5AR, tucked in an alley off the high street. Great for sharing.",tips:"Closed Mondays; check Saturday evening hours and book."},
  {id:"bath-pub-star",name:"The Star Inn (pub)",cat:"pub",lat:51.3895,lng:-2.3640,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1 hr",rating:4.5,desc:"Old-school Georgian pub in The Vineyards with Bellringer ale served from the jug and snug rooms with fires — my pick for a proper pub.",tips:"Suggestion — verify. Other options: The Raven on Queen Street (pies and ales), The Bell on Walcot Street (live music)."},
  {id:"bath-pub-raven",name:"The Raven (pub)",cat:"pub",lat:51.3822,lng:-2.3632,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1 hr",rating:4.4,desc:"Compact real-ale pub on Queen Street known for pies and a rotating cask list. Good start or end to the evening.",tips:"Suggestion — verify."},
  {id:"bath-bar-opium",name:"Opium (cocktail bar)",cat:"pub",lat:51.3794,lng:-2.3578,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1-2 hrs",rating:4.5,desc:"Dark, candlelit cocktail bar in a cellar on Pierrepont Place — a classic date-night nightcap.",tips:"Suggestion — verify hours and whether it's still trading. Easy to pair with Yak Yeti Yak next door."},
  // PRACTICAL STOPS (parking, shopping, grouped options)
  {id:"waitrose",name:"Waitrose Cirencester (dinner shop)",cat:"practical",lat:51.7170,lng:-1.9690,region:"Cotswolds",wiki:"Cirencester",weather:"rain-ok",duration:"30 min",rating:4.4,desc:"Sheep Street, Cirencester GL7 1SZ. Shopping for Friday's home-cooked dinner, on the way from Bourton to South Cerney.",tips:"Co-op South Cerney is the backup."},
  {id:"park-bath",name:"Park: Charlotte Street car park, Bath",cat:"practical",lat:51.3862,lng:-2.3655,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"All day",rating:4.0,desc:"All-day parking near Queen Square, about 10 minutes' walk to the Circus and Royal Crescent.",tips:"Fallback: Lansdown Park & Ride.",gmq:"Charlotte Street Car Park, Bath"},
  {id:"bath-dinner",name:"Saturday dinner — pick on the day",cat:"pub",lat:51.3815,lng:-2.3585,region:"Bath",wiki:"Bath,_Somerset",weather:"rain-ok",duration:"1.5-2 hrs",rating:4.5,desc:"Yak Yeti Yak, Jars Meze, Sarthi, Angelo's or Chilli Family Noodles — choose on the day.",tips:"Saturday is busy — go early.",gmq:"Yak Yeti Yak, 12 Pierrepont Street, Bath"},

function toast(msg){
  const el=document.getElementById('toast');

// ===================== MAP =====================
function initMap(){
  state.map = L.map('map',{zoomControl:false}).setView([51.9,-2.8],9);
  L.control.zoom({position:'bottomright'}).addTo(state.map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:18
  }).addTo(state.map);
  A.forEach(a => {
    const color = catMeta(a.cat).color;
    const icon = L.divIcon({className:'',
      html:'<div style="width:14px;height:14px;border-radius:50%;background:'+color+';border:2.5px solid #fff;box-shadow:0 2px 6px rgba(70,45,20,.28)"></div>',
      iconSize:[14,14],iconAnchor:[7,7]});
    const marker = L.marker([a.lat,a.lng],{icon}).addTo(state.map);
    marker.bindPopup(
      '<img class="popup-img" src="'+getImg(a)+'" alt="'+a.name+'" onerror="this.style.display=\'none\'">'+
      '<div class="popup-title">'+a.name+'</div>'+
      '<div class="popup-meta">'+a.region+' · '+a.duration+' · ⭐ '+a.rating+'</div>'+
      '<div class="popup-desc">'+a.desc.substring(0,110)+'...</div>'+
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">'+
        '<button class="popup-btn" style="background:#e4eee7;color:#3f5c4c" onclick="openDetail(\''+a.id+'\')">Details</button>'+
        '<button class="popup-btn" style="background:#f3e2cf;color:#9a5524" onclick="addToItinerary(\''+a.id+'\',1);closePopup()">+D1</button>'+
        '<button class="popup-btn" style="background:#e4eee7;color:#3f5c4c" onclick="addToItinerary(\''+a.id+'\',2);closePopup()">+D2</button>'+
        '<button class="popup-btn" style="background:#e3edf3;color:#4a6f8a" onclick="addToItinerary(\''+a.id+'\',3);closePopup()">+D3</button>'+
      '</div>');
    marker.on('click',()=>highlightStop(a.id));
    state.markers[a.id] = marker;
  });
}
function closePopup(){state.map.closePopup();}
function fitRoute(){
  const allPts=Object.values(state.itinerary).flat().map(id=>{const a=A.find(x=>x.id===id);return a?[a.lat,a.lng]:null;}).filter(Boolean);
  if(allPts.length>0) state.map.fitBounds(L.latLngBounds(allPts),{padding:[50,50]});
  else toast('Add some stops first');
}

function highlightStop(id){

}

function renderExplore(el){
  const filtered = A.filter(a => {
    const catOk = state.activeFilter==='all'||a.cat===state.activeFilter;
    const wOk = state.weatherFilter==='all'||
      (state.weatherFilter==='rain'&&(a.weather==='rain-ok'||a.weather==='either'))||
      (state.weatherFilter==='dry'&&(a.weather==='dry'||a.weather==='either'));
    return catOk && wOk;
  });
  if(!filtered.length){
    el.innerHTML='<div class="empty-day" style="margin:20px 0">Nothing matches those filters.<br>Try a different category or weather setting.</div>';
    return;
  }
  el.innerHTML = filtered.map(a => {
    const {color,label:catLabel}=catMeta(a.cat);
    const wl = a.weather==='rain-ok'?'Wet weather':a.weather==='dry'?'Dry days':'Any weather';
    const inItin = Object.values(state.itinerary).flat().includes(a.id);
    return '<div class="activity-card '+(inItin?'in-itinerary':'')+'" data-stop="'+a.id+'" onclick="openDetail(\''+a.id+'\')">'+
      '<div class="img-wrap"><img src="'+getImg(a)+'" alt="'+a.name+'" loading="lazy">'+
      '<div class="cat-badge" style="background:'+color+'">'+catLabel+'</div>'+
      '<div class="weather-badge">'+wl+'</div></div>'+
      '<div class="card-body"><h3>'+a.name+'</h3>'+
      '<div class="meta">'+a.region+' · '+a.duration+' · ★ '+a.rating+(a.priceBand?' · '+a.priceBand:'')+'</div>'+
      '<p>'+a.desc+'</p>'+
      '<div class="card-actions" onclick="event.stopPropagation()">'+
        '<button class="btn-add d1" onclick="addToItinerary(\''+a.id+'\',1)">+ D1</button>'+
        '<button class="btn-add d2" onclick="addToItinerary(\''+a.id+'\',2)">+ D2</button>'+
        '<button class="btn-add d3" onclick="addToItinerary(\''+a.id+'\',3)">+ D3</button>'+
      '</div></div></div>';
  }).join('');
}

// ===================== DRAG & DROP =====================
function bindDragDrop(){
  let dragEl=null;
  document.querySelectorAll('.itin-stop[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragEl=el;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',el.dataset.stop);
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging');
      document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
      dragEl=null;
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||dragEl===el) return;
      el.classList.add('drop-target');
    });
    el.addEventListener('dragleave',()=>el.classList.remove('drop-target'));
    el.addEventListener('drop',e=>{
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('drop-target');
      if(!dragEl||dragEl===el) return;
      const fromDay=+dragEl.dataset.day;
      const toDay=+el.dataset.day;
      const fromIdx=+dragEl.dataset.idx;
      const toIdx=+el.dataset.idx;
      const id=dragEl.dataset.stop;
      // remove from source
      state.itinerary[fromDay]=state.itinerary[fromDay].filter(x=>x!==id);
      // insert into target (adjust index if same day and moved down)
      let insertAt=toIdx;
      if(fromDay===toDay && fromIdx<toIdx) insertAt=toIdx;
      state.itinerary[toDay].splice(insertAt,0,id);
      saveLocal();
      renderList();updateRouteLines();updateMarkerVisibility();
      toast('Moved to '+(DAYS.find(d=>d.id===toDay)?.label||('Day '+toDay)));
    });
  });
}

function toggleDay(dayId){
  state.collapsed[dayId]=!state.collapsed[dayId];
  renderList();
}

let rainOpen = {1:false,2:false,3:false};
function toggleRain(dayId){
  rainOpen[dayId]=!rainOpen[dayId];
  renderList();
}
function applyRainSwap(dayId, idx){
  const s = (RAIN_SWAPS[dayId]||[])[idx];
  if(!s) return;
  const day = state.itinerary[dayId];
  if(!day.includes(s.swapOut)) return;
  if(state.itinerary[1].includes(s.swapIn)||state.itinerary[2].includes(s.swapIn)||state.itinerary[3].includes(s.swapIn)){
    toast('Already on the plan');
    return;
  }
  const at = day.indexOf(s.swapOut);
  day[at] = s.swapIn;
  saveLocal();renderList();updateRouteLines();updateMarkerVisibility();
  const a=A.find(x=>x.id===s.swapIn);
  toast('Rain swap to '+(a?a.name:s.swapIn));
}

  Object.keys(state.itinerary).forEach(d=>{state.itinerary[d]=state.itinerary[d].filter(x=>x!==id);});

  saveLocal();renderList();updateRouteLines();updateMarkerVisibility();

  toast((a?a.name:'Stop')+' → '+(DAYS.find(d=>d.id===day)?.label||('Day '+day)));

function moveStop(dayId,index,dir){
  const arr=state.itinerary[dayId];
  const ni=index+dir;
  if(ni<0||ni>=arr.length) return;
  [arr[index],arr[ni]]=[arr[ni],arr[index]];
  saveLocal();renderList();updateRouteLines();

  const openIt = ()=>{
    state.map.invalidateSize();
    state.map.setView([a.lat,a.lng],14,{animate:true});

      marker.openPopup();

function updateRouteLines(){
  state.routeLines.forEach(l=>state.map.removeLayer(l));
  state.routeLines=[];
  const dc={1:'#c47a3e',2:'#3f5c4c',3:'#4a6f8a'};
  DAYS.forEach(day=>{
    const stops=state.itinerary[day.id];
    if(stops.length<2) return;
    const pts=stops.map(id=>{const a=A.find(x=>x.id===id);return a?[a.lat,a.lng]:null;}).filter(Boolean);
    state.routeLines.push(L.polyline(pts,{color:dc[day.id],weight:3.5,opacity:.82,dashArray:'10,8',lineCap:'round'}).addTo(state.map));
  });
  A.forEach(a=>{
    const marker=state.markers[a.id];
    let icon;
    const itinEntry = findItinEntry(a.id);
    if(itinEntry){
      const dayColor = dc[itinEntry.dayId];
      icon = L.divIcon({className:'',
        html:'<div style="width:30px;height:30px;border-radius:50%;background:'+dayColor+';border:3px solid #fff;box-shadow:0 3px 10px rgba(70,45,20,.35);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;font-family:DM Sans,sans-serif">'+itinEntry.num+'</div>',
        iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-18]});
    } else {
      const color=catMeta(a.cat).color;
      icon = L.divIcon({className:'',
        html:'<div style="width:14px;height:14px;border-radius:50%;background:'+color+';border:2.5px solid #fff;box-shadow:0 2px 6px rgba(70,45,20,.28)"></div>',
        iconSize:[14,14],iconAnchor:[7,7]});
    }
    marker.setIcon(icon);
  });
}
function findItinEntry(id){
  for(const day of DAYS){
    const idx = state.itinerary[day.id].indexOf(id);
    if(idx >= 0) return {dayId:day.id, num:idx+1};
  }
  return null;
}
function updateMarkerVisibility(){
  A.forEach(a=>{
    const marker=state.markers[a.id];
    const catOk=state.activeFilter==='all'||a.cat===state.activeFilter;
    const wOk=state.weatherFilter==='all'||
      (state.weatherFilter==='rain'&&(a.weather==='rain-ok'||a.weather==='either'))||
      (state.weatherFilter==='dry'&&(a.weather==='dry'||a.weather==='either'));
    const inItin=Object.values(state.itinerary).flat().includes(a.id);
    const visible=(catOk&&wOk)||inItin;
    if(visible&&!state.map.hasLayer(marker)) marker.addTo(state.map);
    if(!visible&&state.map.hasLayer(marker)) state.map.removeLayer(marker);
  });
}

function fetchWikiImages(){
  const wikiPages = [...new Set(A.map(a=>a.wiki).filter(Boolean))];
  const batchSize = 10;
  for(let i=0;i<wikiPages.length;i+=batchSize){
    const batch = wikiPages.slice(i,i+batchSize);
    const titles = batch.join('|');
    const url = 'https://en.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(titles)+
      '&prop=pageimages&format=json&pithumbsize=600&origin=*';
    fetch(url).then(r=>r.json()).then(data=>{
      if(!data.query||!data.query.pages) return;
      const pages = data.query.pages;
      const imgMap = {};
      Object.values(pages).forEach(p=>{
        if(p.thumbnail&&p.thumbnail.source){
          const key = p.title.replace(/ /g,'_');
          imgMap[key] = p.thumbnail.source;
          imgMap[decodeURIComponent(key)] = p.thumbnail.source;
        }
      });
      A.forEach(a=>{
        if(a.wiki){
          const key = decodeURIComponent(a.wiki);
          if(imgMap[key]) a.img = imgMap[key];
          else if(imgMap[a.wiki]) a.img = imgMap[a.wiki];
        }
      });
      renderList();
      Object.keys(state.markers).forEach(id=>{
        const marker = state.markers[id];
        const act = A.find(x=>x.id===id);
        if(act && marker.isPopupOpen()){
          const popupImg = document.querySelector('.leaflet-popup .popup-img');
          if(popupImg) popupImg.src = act.img;
        }
      });
    }).catch(()=>{});
  }
}
function getImg(a){
  if(a.img && typeof a.img === 'string' && a.img.length > 10) return a.img;
  const bg = {waterfall:'#2c4d6e',hike:'#2a4a32',viewpoint:'#6b5420',village:'#4a2f66',pub:'#6b2e28',hotel:'#1a4a5c',stay:'#1a4a5c',abbey:'#4a2f66',drive:'#6b4420',activity:'#1a5c52'}[a.cat]||'#555';
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function saveLocal(){

function loadLocal(){
  try{
    const raw=localStorage.getItem('uk-road-trip-v2');
    if(!raw) return false;

const ID_INDEX = (()=>{const m={};A.forEach((a,i)=>{m[a.id]=i;});return m;})();
const DEFAULT_LABELS = DAYS.map(d=>d.label);

function encodePlan(){
  // 7 bits per stop index (max 127 stops), day lengths first, then base64url
  const idxs = [];
  [1,2,3].forEach(d=>{
    const ids = state.itinerary[d]
      .map(id=>ID_INDEX[id])
      .filter(n=>n!=null)
      .map(n=>Math.min(127,n));
    idxs.push(ids.length, ...ids);
  });
  const bits = [];
  idxs.forEach(n=>{ for(let i=6;i>=0;i--) bits.push((n>>i)&1); });
  let bin = '';
  for(let i=0;i<bits.length;i+=8){
    let byte = 0;
    for(let j=0;j<8;j++) byte = (byte<<1) | (bits[i+j]||0);
    bin += String.fromCharCode(byte);
  }
  let s = btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const labels = DAYS.map(d=>d.label);
  if(labels.some((l,i)=>l!==DEFAULT_LABELS[i])){
    s += '~'+encodeURIComponent(labels.join('\u001e'));
  }
  return s;
}
function decodePlan(){
  try{
    // accept #p=, ?p=, or legacy #plan=
    const src = (location.hash||'') + '&' + (location.search||'');
    let m = src.match(/[#&?]p=([^&]+)/);
    if(m){
      const raw = decodeURIComponent(m[1]);
      const cut = raw.indexOf('~');
      const main = cut<0 ? raw : raw.slice(0,cut);
      const labs = cut<0 ? null : raw.slice(cut+1).split('\u001e');
      const b64 = main.replace(/-/g,'+').replace(/_/g,'/');
      const pad = b64 + '='.repeat((4 - (b64.length % 4)) % 4);
      const bin = atob(pad);
      const bits = [];
      for(let i=0;i<bin.length;i++){
        const byte = bin.charCodeAt(i);
        for(let j=7;j>=0;j--) bits.push((byte>>j)&1);
      }
      const read6 = (off)=>{
        let v = 0;
        for(let j=0;j<7;j++) v = (v<<1) | (bits[off+j]||0);
        return v;
      };
      state.itinerary = {1:[],2:[],3:[]};
      let off = 0;
      [1,2,3].forEach(d=>{
        const len = read6(off); off += 7;
        for(let k=0;k<len;k++){
          const n = read6(off); off += 7;
          const a = A[n];
          if(a) state.itinerary[d].push(a.id);
        }
      });
      if(labs) labs.forEach((l,i)=>{if(DAYS[i]) DAYS[i].label=l;});
      return true;
    }
    // legacy base64 JSON: #plan=...
    m = src.match(/plan=([A-Za-z0-9+/]+)/);
    if(!m) return false;
    const json=decodeURIComponent(escape(atob(m[1])));
    const d=JSON.parse(json);
    if(d.i) state.itinerary={1:[...(d.i[1]||[])],2:[...(d.i[2]||[])],3:[...(d.i[3]||[])]};
    if(d.l) d.l.forEach((l,i)=>{if(DAYS[i]) DAYS[i].label=l;});
    return true;
  }catch(e){return false;}
}
function buildShareUrl(){
  // ?p= plays nicer with URL shorteners than #p=
  const base = location.protocol==='file:'
    ? 'https://ming-256.github.io/uk-road-trip/'
    : location.href.split('#')[0].split('?')[0];
  return base+'?p='+encodePlan();
}
function copyShareLink(){
  const url=buildShareUrl();
  navigator.clipboard.writeText(url).then(()=>{
    document.getElementById('share-status').innerHTML='Link copied ('+url.length+' chars).<br><span style="color:var(--ink-mute);font-size:.72rem;word-break:break-all">'+url+'</span>';
    toast('Link copied');
  }).catch(()=>{
    document.getElementById('share-status').textContent='Could not copy. URL: '+url;
  });
}
function copyShortLink(){
  const url = buildShareUrl();
  const status = document.getElementById('share-status');
  status.innerHTML = '<span style="color:var(--ink-mute)">Shortening…</span>';

  const tryIsGd = ()=>
    fetch('https://is.gd/create.php?format=json&url='+encodeURIComponent(url))
      .then(r=>r.json())
      .then(d=>{
        if(!d || !d.shorturl) throw new Error(d && d.errormessage || 'no shorturl');
        return d.shorturl;
      });

  const tryClck = ()=>
    fetch('https://clck.ru/--?url='+encodeURIComponent(url))
      .then(r=>r.text())
      .then(t=>{
        const s = t.trim();
        if(!/^https:\/\/clck\.ru\//.test(s)) throw new Error('bad clck');
        return s;
      });

  const finish = (short)=>{
    navigator.clipboard.writeText(short).then(()=>{
      status.innerHTML='Short link copied ('+short.length+' chars).<br><span style="color:var(--ink-mute);font-size:.72rem;word-break:break-all">'+short+'</span>';
      toast('Short link copied');
    }).catch(()=>{
      status.innerHTML='Short link: <span style="color:var(--ink-mute);font-size:.72rem;word-break:break-all">'+short+'</span>';
    });
  };

  const fallback = ()=>{
    navigator.clipboard.writeText(url).then(()=>{
      status.innerHTML='Shortener unavailable — copied the compact link ('+url.length+' chars).<br><span style="color:var(--ink-mute);font-size:.72rem;word-break:break-all">'+url+'</span>';
      toast('Compact link copied');
    });
  };

  tryIsGd().catch(()=>tryClck()).then(finish).catch(fallback);
}
function copyShareText(){
  let text='UK road trip · 20–22 Nov\n\n';
  DAYS.forEach(day=>{
    const stops=state.itinerary[day.id].map(id=>A.find(x=>x.id===id)).filter(Boolean);
    if(!stops.length) return;
    text+=day.label+'\n';
    stops.forEach((a,i)=>{text+='  '+(i+1)+'. '+a.name+'\n';});
    text+='\n';
  });
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('share-status').textContent='Message text copied.';
    toast('Message copied');
  }).catch(()=>{
    document.getElementById('share-status').textContent=text;
  });
}

// ===================== MOBILE VIEW =====================
function setMobileView(mode, opts){
  const fit = !opts || opts.fit !== false;
  const app=document.getElementById('app');
  const list=document.getElementById('mt-list');
  const map=document.getElementById('mt-map');
  if(mode==='map'){
    app.classList.add('show-map');
    list.classList.remove('active');
    map.classList.add('active');
    requestAnimationFrame(()=>{
      if(state.map) state.map.invalidateSize();
      if(fit && state.map && Object.values(state.markers).length) fitRoute();
    });
  }else{
    app.classList.remove('show-map');
    list.classList.add('active');
    map.classList.remove('active');
    requestAnimationFrame(()=>{ if(state.map) state.map.invalidateSize(); });
  }
}
